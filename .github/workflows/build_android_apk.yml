name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/build_android_apk.yml"
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/build_android_apk.yml"

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-apk:
    name: Build Unsigned APK
    # 第三方 PR 不可信：只出免签包，不接触签名密钥。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Build Metadata
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main

          BUILD_NUMBER="$(git rev-list --count origin/main)"
          BUILD_CHANNEL="pr"
          BUILD_LABEL="PR #${{ github.event.pull_request.number }}"

          {
            echo "APP_BUILD_NUMBER=$BUILD_NUMBER"
            echo "APP_BUILD_CHANNEL=$BUILD_CHANNEL"
            echo "APP_BUILD_LABEL=$BUILD_LABEL"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --non-interactive --no-install --platform android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Show build environment
        run: |
          echo "BUILD_CHANNEL=${{ env.APP_BUILD_CHANNEL }}"
          echo "BUILD_LABEL=${{ env.APP_BUILD_LABEL }}"
          echo "BUILD_NUMBER=${{ env.APP_BUILD_NUMBER }}"
          node --version
          java -version

      - name: Build unsigned APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK not signed
        run: |
          set -euo pipefail
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK_PATH"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          if "$APKSIGNER" verify "$APK_PATH" 2>/dev/null; then
            echo "::error::Expected unsigned APK but verification succeeded."
            exit 1
          fi

      - name: Collect APK
        run: |
          set -euo pipefail
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK_PATH"
          cp "$APK_PATH" "novella-pr-${{ github.event.pull_request.number }}-unsigned.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: novella-android-unsigned-apk
          path: novella-*-unsigned.apk
          if-no-files-found: error

  build-signed-apk:
    name: Build Signed APK
    # 仅官方通道签名：push 到 main，或打 vX.Y.Z 发布 tag。
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref_name == 'main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Build Metadata
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main

          RELEASE_VERSION=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Release tag must use vX.Y.Z format: $GITHUB_REF_NAME"
              exit 1
            fi
            RELEASE_VERSION="${BASH_REMATCH[1]}"
            BUILD_NUMBER="$(git rev-list --count HEAD)"
            BUILD_CHANNEL="tag"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            BUILD_NUMBER="$(git rev-list --count HEAD)"
            BUILD_CHANNEL="main"
          else
            BUILD_NUMBER="$(git rev-list --count origin/main)"
            BUILD_CHANNEL="branch"
          fi
          BUILD_LABEL="Build $BUILD_NUMBER"

          {
            echo "APP_VERSION=$RELEASE_VERSION"
            echo "APP_BUILD_NUMBER=$BUILD_NUMBER"
            echo "APP_BUILD_CHANNEL=$BUILD_CHANNEL"
            echo "APP_BUILD_LABEL=$BUILD_LABEL"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: npx expo prebuild --non-interactive --no-install --platform android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Decode Keystore
        # prebuild 之后执行：android/ 是生成产物，checkout 时不存在。
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ENCODED_STRING" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret for signed build."
            exit 1
          fi
          printf '%s' "$ENCODED_STRING" | base64 --decode > apps/mobile/android/app/release.keystore
          test -s apps/mobile/android/app/release.keystore

      - name: Show build environment
        run: |
          echo "BUILD_CHANNEL=${{ env.APP_BUILD_CHANNEL }}"
          echo "BUILD_LABEL=${{ env.APP_BUILD_LABEL }}"
          echo "BUILD_NUMBER=${{ env.APP_BUILD_NUMBER }}"
          echo "RELEASE_VERSION=${{ env.APP_VERSION }}"
          node --version
          java -version

      - name: Build signed APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Collect APK
        run: |
          set -euo pipefail
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"

          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          test -n "$AAPT"

          VERSION="$(
            "$AAPT" dump badging "$APK_PATH" 2>/dev/null |
              grep -o "versionName='[^']*'" |
              head -1 |
              cut -d"'" -f2
          )"
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to read versionName from APK."
            exit 1
          fi
          if [ -n "${{ env.APP_VERSION }}" ] && [ "$VERSION" != "${{ env.APP_VERSION }}" ]; then
            echo "::error::Built version $VERSION does not match tag version ${{ env.APP_VERSION }}"
            exit 1
          fi

          cp "$APK_PATH" "novella-${VERSION}-${{ env.APP_BUILD_NUMBER }}-signed.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: novella-android-signed-apk
          path: novella-*-signed.apk
          if-no-files-found: error
