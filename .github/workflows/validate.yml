name: Validate

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and boundaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check shared package boundaries
        run: npm run check:boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Build public site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build --workspace @novella/site
